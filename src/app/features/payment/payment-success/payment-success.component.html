<div class="container-fluid mt-3 success-page">
  <div class="card shadow-sm success-card">
    <div class="card-body text-center py-5">
      <h6 class="form-title mb-3">Congratulations</h6>
      <div class="illus-success mb-4">
        <div class="rocket-circle">
          <span class="rocket">🚀</span>
          <span class="confetti">✦</span>
          <span class="confetti c2">♦</span>
          <span class="confetti c3">●</span>
        </div>
      </div>
      <h4 class="fw-bold mb-2">Congratulations!</h4>
      <p class="text-muted mb-4">Great job, your work here is done</p>
      <app-core-button label="VIEW TICKET" width="100%" [onClick]="viewTicket" />
    </div>
  </div>
</div>
