<div class="otp-page d-flex justify-content-center align-items-center"
    style="background-color: var(--app_background_color);">
    <div class="otp-box card shadow-lg">
        <div class="card-body p-4">
            <app-core-title text="VERIFY OTP"></app-core-title>
            <small class="text-muted d-block mb-3">Enter the 4-digit code sent to your mobile</small>

            <form (ngSubmit)="onVerify()">
                <div class="otp-inputs d-flex justify-content-center gap-2 mb-3">
                    <input type="text" class="form-control otp-digit text-center" maxlength="1"
                        [formControl]="otpForm.controls.digit1" />
                    <input type="text" class="form-control otp-digit text-center" maxlength="1"
                        [formControl]="otpForm.controls.digit2" />
                    <input type="text" class="form-control otp-digit text-center" maxlength="1"
                        [formControl]="otpForm.controls.digit3" />
                    <input type="text" class="form-control otp-digit text-center" maxlength="1"
                        [formControl]="otpForm.controls.digit4" />
                </div>
                @if (errorMessage) {
                    <p class="text-danger small mb-2">{{ errorMessage }}</p>
                }
                <div class="mt-3">
                    <app-core-button
                        label="VERIFY"
                        type="submit"
                        width="100%"
                        [onClick]="onVerify">
                    </app-core-button>
                </div>
            </form>
            <p class="text-center mt-3 mb-0 small">
                <button type="button" class="btn btn-link btn-sm p-0" (click)="onResend()">
                    Resend OTP
                </button>
            </p>
        </div>
    </div>
</div>
