<div class="d-flex justify-content-center align-items-center vh-100"
    style="background-color: var(--app_background_color);">
    <div class="card shadow-lg login-card d-flex flex-row">

        <!-- LEFT SIDE : LOGO -->
        <div class="left-panel d-flex justify-content-center align-items-center">
            <!-- <img src="assets/app-icon/app-logo.png" alt="Parking Logo" class="logo-img" /> -->
        </div>

        <!-- RIGHT SIDE : LOGIN FORM -->
        <div class="right-panel p-4 d-flex flex-column">
            <app-core-title text="USER LOGIN"></app-core-title>

            <div class="mt-3">
                <app-core-input placeholder="Username or Email" icon="bi bi-person-fill"
                    [control]="loginForm.controls['email']">
                </app-core-input>
            </div>

            <div class="mt-3">
                <app-core-input placeholder="Password" icon="bi bi-lock-fill"
                    [control]="loginForm.controls['password']">
                </app-core-input>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-3 small">
                <label class="d-flex align-items-center gap-1">
                    <input type="checkbox" />
                    Remember me
                </label>
                <a href="#" class="text-decoration-none text-dark">
                    Forgot Password?
                </a>
            </div>

            <div class="mt-3">
                <app-core-button label="SUBMIT" width="100%"></app-core-button>
            </div>
            <div>
                <div class="d-flex align-items-center">
                    <hr class="flex-grow-1" />
                    <span class="mx-2 text-muted">OR</span>
                    <hr class="flex-grow-1" />
                </div>
            </div>
            <app-core-button label="CREATE ACCOUNT" width="50%"></app-core-button>
        </div>
    </div>
</div>
